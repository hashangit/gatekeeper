name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Agent Skills reference validator
        run: python3 -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          python3 scripts/check-skills.py
          python3 scripts/check-release-safety.py
          python3 scripts/sync-skills.py --check
          skills-ref validate skills/gatekeeper
          skills-ref validate skills/gatekeeper-review
          skills-ref validate skills/gatekeeper-release
          bash -n skills/gatekeeper/scripts/publish.sh
          node --check skills/gatekeeper/scripts/generate-release-notes.mjs
          plugin_version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          test "$RELEASE_TAG" = "v$plugin_version"
      - name: Require a passing Release receipt for the sealed parent
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              sys.exit("Invalid release tag")
          try:
              sealed = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          except subprocess.CalledProcessError:
              sys.exit("Release commit must have a candidate parent")

          matches = []
          for receipt in sorted(Path("Reviews").glob("*-gatekeeper-RELEASE.md")):
              if receipt.is_symlink() or not receipt.is_file():
                  continue
              text = receipt.read_text(encoding="utf-8")
              if len(re.findall(r"^Mode: RELEASE\s*$", text, re.MULTILINE)) != 1:
                  continue
              if len(re.findall(r"^Verdict: PASS\s*$", text, re.MULTILINE)) != 1:
                  continue
              headers = re.findall(
                  r"^Branch: [^|\r\n]+ \| Seal: `?([0-9a-f]{40,64})`? \| Gates: [^\r\n]+$",
                  text,
                  re.MULTILINE,
              )
              if len(headers) == 1 and headers[0] == sealed:
                  matches.append(receipt)

          if len(matches) != 1:
              sys.exit(f"Expected one RELEASE PASS receipt sealed to {sealed}; found {len(matches)}")
          notes = Path(f"RELEASE_NOTES-{tag}.md")
          if notes.is_symlink() or not notes.is_file() or not notes.read_text(encoding="utf-8").strip():
              sys.exit(f"Missing or empty committed release notes: {notes}")
          print(f"Verified {matches[0]} for sealed candidate {sealed}")
          PY

  create-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag still points to the validated commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_commit="$(git rev-parse --verify --end-of-options "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$EXPECTED_SHA" || {
            echo "Release tag no longer points to the validated commit." >&2
            exit 1
          }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "RELEASE_NOTES-${RELEASE_TAG}.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "RELEASE_NOTES-${RELEASE_TAG}.md"
          fi
