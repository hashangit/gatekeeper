name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check release safety
        run: python3 scripts/check-release-safety.py
      - run: python3 scripts/check-skills.py
      - name: Install Agent Skills reference validator
        run: python3 -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
      - name: Validate Agent Skills format
        run: |
          skills-ref validate skills/gatekeeper
          skills-ref validate skills/gatekeeper-review
          skills-ref validate skills/gatekeeper-release
      - name: Check publishing script syntax
        run: |
          bash -n skills/gatekeeper/scripts/publish.sh
          node --check skills/gatekeeper/scripts/generate-release-notes.mjs
